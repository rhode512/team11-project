services:
  db:
    image: mariadb:11
    container_name: team11-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: change_me
      MARIADB_DATABASE: team11
      MARIADB_USER: team11
      MARIADB_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: